  // Function to generate the HTML of images and phrases
  function generateGallery() {
    const gallery = document.getElementById("gallery");
    imageData.forEach((data) => {

      colDiv.classList.add("col-12", "col-md-6", "col-lg-3");
      colDiv.innerHTML = `
                <div class="flip-container">
                    <div class="flipper">
                        <div class="front">
                            <img src="${data.url}" alt="Image" class="img-fluid mb-4" wm-literaryGenre="${data.literaryGenre}">
                        </div>
                        <div class="back">
                            <p>${data.quote}</p>
                        </div>
                    </div>
                </div>
            `;
      gallery.appendChild(colDiv);
    });
  }
