<div wm-include="/pages/galery/galeryHeader.html"></div>
<div class="container mt-5">
  <div class="row justify-content-center pb-5">
    <div wm-literaryGenre-buttons></div>
  </div>
  <div class="row d-flex justify-content-center" id="gallery">
    <!-- Images and phrases will be dynamically generated here -->
  </div>
</div>
<script>
  // List of objects containing URLs of images and phrases
  const imageData = [
    {
      url: "/imgs/ny.jpg",
      quote:
        '“You could rattle the stars," she whispered. "You could do anything, if only you dared. And deep down, you know it, too. That’s what scares you most.”',
      literaryGenre: "Naaa",
    },
    {
      url: "/imgs/ny.jpg",
      quote: "“The only way to do great work is to love what you do.”",
      literaryGenre: "NY",
    },
    {
      url: "/imgs/ny.jpg",
      quote:
        "“Success is not final, failure is not fatal: It is the courage to continue that counts.”",
      literaryGenre: "NY",
    },
    {
      url: "/imgs/ny.jpg",
      quote:
        "“It does not matter how slowly you go as long as you do not stop.”",
      literaryGenre: "NY",
    },
    {
      url: "/imgs/ny.jpg",
      quote: "“You must be the change you wish to see in the world.”",
      literaryGenre: "NY",
    },
  ];

  // Function to generate the HTML of images and phrases
  function generateGallery() {
    const gallery = document.getElementById("gallery");
    imageData.forEach((data) => {
      const colDiv = document.createElement("div");
      colDiv.classList.add("col-12", "col-md-6", "col-lg-3");
      colDiv.innerHTML = `
                <div class="flip-container">
                    <div class="flipper">
                        <div class="front">
                            <img src="${data.url}" alt="Image" class="img-fluid mb-4" wm-literaryGenre="${data.literaryGenre}">
                        </div>
                        <div class="back">
                            <p>${data.quote}</p>
                        </div>
                    </div>
                </div>
            `;
      gallery.appendChild(colDiv);
    });
  }

  // Call the function to generate the gallery
  generateGallery();
</script>
